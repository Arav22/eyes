[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "eyes-mcp"
version = "0.1.0"
description = "MCP server that gives AI coding agents live computer vision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arav22" }]
keywords = ["mcp", "computer-vision", "ai-agents", "screen-capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.8.0"]
ocr = ["pytesseract>=0.3.10"]
all = ["opencv-python>=4.8.0", "pytesseract>=0.3.10"]

[project.scripts]
eyes = "eyes.server:main"

[tool.setuptools.packages.find]
where = ["src"]
